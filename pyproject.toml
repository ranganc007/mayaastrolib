[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mayaastrolib"
version = "0.3.2"
description = "Python library for Traditional and Vedic Astrology (fork of flatangle/flatlib)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["astrology", "traditional astrology", "vedic astrology", "swiss ephemeris"]
authors = [
    { name = "João Ventura", email = "flatangleweb@gmail.com" },
]
maintainers = [
    { name = "Rangan C.", email = "ranganc@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Environment :: Other Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyswisseph>=2.10.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "skyfield>=1.46",  # tests/golden/generate_fixtures.py — MIT, dev-only
]

[project.urls]
Homepage = "https://github.com/ranganc007/mayaastrolib"
Repository = "https://github.com/ranganc007/mayaastrolib"
Documentation = "https://github.com/ranganc007/mayaastrolib/tree/master/docs"
Changelog = "https://github.com/ranganc007/mayaastrolib/blob/master/CHANGELOG.md"
Issues = "https://github.com/ranganc007/mayaastrolib/issues"
Upstream = "https://github.com/flatangle/flatlib"

[tool.setuptools.packages.find]
# Auto-discover all subpackages (incl. mayaastrolib.vedic and any future
# ones) so the build can't silently drop a package the way a hand-kept
# list did before 0.3.0.
include = ["mayaastrolib*", "flatlib*"]

[tool.setuptools.package-data]
mayaastrolib = [
    "resources/README.md",
    "resources/swefiles/*.se1",
    "resources/swefiles/*.cat",
    "resources/swefiles/*.txt",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "A", "UP"]
ignore = ["UP031"]  # see docs/RUFF-DEBT.md

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = ["."]

[tool.coverage.run]
source = ["mayaastrolib"]
