name: Package

# Builds the sdist + wheel and proves the wheel actually works on every push
# and PR — not just at release time. This is the early-warning version of the
# verify step in publish.yml: it catches packaging regressions (a dropped
# subpackage, a missing data file, broken metadata) the moment they land,
# instead of when a release is cut. No PyPI credentials are involved.

on:
  push:
    branches: [development, master]
  pull_request:
    branches: [development]

permissions:
  contents: read

jobs:
  package:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Validate metadata
        run: twine check dist/*

      - name: Verify the built wheel actually works
        # Install the wheel into a clean venv, outside the source tree (so an
        # editable install can't mask a missing module), and compute a real
        # Western + Vedic chart. If a subpackage was dropped from the build,
        # this fails here rather than on PyPI.
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          cd /tmp
          /tmp/verify/bin/python - <<'PY'
          import mayaastrolib as m
          from mayaastrolib import const
          from mayaastrolib.chart import Chart
          from mayaastrolib.datetime import Datetime
          from mayaastrolib.geopos import GeoPos
          from mayaastrolib.vedic.nakshatras import janma_nakshatra
          d = Datetime("2015/03/13", "17:00", "+00:00")
          p = GeoPos("38n32", "8w54")
          assert str(Chart(d, p).get(const.SUN)).startswith("<Sun Pisces")
          vc = Chart(d, p, zodiac=const.ZODIAC_SIDEREAL, ayanamsa=const.AYANAMSA_LAHIRI)
          assert janma_nakshatra(vc).name  # vedic subpackage must ship and work
          print("verified wheel:", m.__version__)
          PY
