name: Publish to PyPI

# Publishes to PyPI via Trusted Publishing (OIDC) — no API token stored
# anywhere. Fires when a GitHub Release is published (e.g. via
# `gh release create vX.Y.Z`). One-time setup required on PyPI: add a
# trusted publisher for this repo (see docs/RELEASING.md).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Verify the version matches the release tag
        # Without this, tagging v1.0.0 against a pyproject.toml that still
        # says 0.5.0 would publish 0.5.0 under a 1.0.0 release — and a
        # version can never be re-uploaded to PyPI.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import tomllib,pathlib; \
            print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "release tag: $TAG / pyproject version: $VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match pyproject version $VERSION"
            exit 1
          fi

      - name: Validate metadata
        run: twine check dist/*

      - name: Verify the built wheel actually works
        # Guards against shipping a broken wheel (e.g. a dropped
        # subpackage): install the wheel into a clean venv, outside the
        # source tree, and compute a real Western + Vedic chart.
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          cd /tmp
          /tmp/verify/bin/python - <<'PY'
          import mayaastrolib as m
          from mayaastrolib import const
          from mayaastrolib.chart import Chart
          from mayaastrolib.datetime import Datetime
          from mayaastrolib.geopos import GeoPos
          from mayaastrolib.vedic.nakshatras import janma_nakshatra
          d = Datetime("2015/03/13", "17:00", "+00:00")
          p = GeoPos("38n32", "8w54")
          assert str(Chart(d, p).get(const.SUN)).startswith("<Sun Pisces")
          vc = Chart(d, p, zodiac=const.ZODIAC_SIDEREAL, ayanamsa=const.AYANAMSA_LAHIRI)
          assert janma_nakshatra(vc).name  # vedic subpackage must ship and work
          print("verified wheel:", m.__version__)
          PY

      - name: Upload built distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mayaastrolib/
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
