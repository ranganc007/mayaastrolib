# ReadTheDocs build configuration.
#
# Enabling the project in the RTD dashboard is a one-time manual step and is
# NOT done by this file — see docs/RELEASING.md.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"   # matches the top of the CI matrix

sphinx:
  configuration: docs/source/conf.py
  # Warnings are errors, exactly as in the local build and CI. A docs build
  # that emits warnings should fail rather than publish quietly-broken pages.
  fail_on_warning: true

python:
  install:
    # The package itself, so autodoc can import it. swisseph is mocked in
    # conf.py (autodoc_mock_imports), so the C extension never needs to build
    # on the RTD workers.
    - method: pip
      path: .
      extra_requirements:
        - docs

formats:
  - pdf
